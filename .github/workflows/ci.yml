name: Java CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Run tests
        run: ./test.sh
      - name: Build executable JAR
        run: ./build.sh
      - name: Verify packaged command-line conversion
        run: |
          java -jar dist/fretflow-ai.jar --version
          java -jar dist/fretflow-ai.jar \
            --input examples/mini-riff.musicxml \
            --output build/smoke.musicxml \
            --tab build/smoke.txt
